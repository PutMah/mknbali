<!DOCTYPE html>
<html lang="id" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citarasa Dewata</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-accent: #fffbeb;
            --text-primary: #1e293b; --text-secondary: #475569; --text-accent: #b45309;
            --border-color: #e2e8f0; --brand-primary: #f97316; --brand-secondary: #d97706;
            --subtle-texture: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-48 50c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48-25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7z" fill="%2394a3b8" fill-opacity="0.05" fill-rule="evenodd"/></svg>');
        }
        html.dark {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-accent: #334155;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-accent: #fb923c;
            --border-color: #334155; --brand-primary: #fb923c; --brand-secondary: #f97316;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: var(--subtle-texture); z-index: -1; }
        h1, h2, h3, .font-display { font-family: 'Playfair Display', serif; }
        .page-enter { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #splash-screen { background: #fffbeb; }
        #splash-screen .title-char { display: inline-block; opacity: 0; transform: translateY(20px); }
        #splash-screen.fade-out { transition: opacity 0.8s ease-in-out; opacity: 0; pointer-events: none; }

        .nav-active i, .nav-active span { color: var(--brand-primary); }
        .tab-active { border-color: var(--brand-primary) !important; background-color: var(--bg-accent) !important; color: var(--text-accent) !important; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .horizontal-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .skeleton { background-color: var(--border-color); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .badge-unlocked { filter: grayscale(0); }
        .badge-locked { filter: grayscale(1); opacity: 0.5; }
    </style>
</head>
<body>
    <div id="auth-container" class="fixed inset-0 z-50 hidden"></div>

    <div id="main-app" class="max-w-md mx-auto bg-transparent min-h-screen opacity-0">
        <header id="app-header" class="sticky top-0 z-30 p-4 flex items-center justify-between bg-transparent backdrop-blur-lg">
            <div class="flex items-center">
                <button id="back-button" class="hidden text-[var(--text-primary)] mr-4"><i class="ph-bold ph-arrow-left text-2xl"></i></button>
                <h1 id="app-title" class="text-2xl font-bold text-[var(--text-primary)]"></h1>
            </div>
            <button id="dark-mode-toggle" class="h-10 w-10 flex items-center justify-center rounded-full bg-[var(--bg-secondary)] shadow-sm text-[var(--text-primary)]"><i class="ph-bold ph-moon"></i></button>
        </header>

        <main id="page-content" class="p-4 pb-24"></main>

        <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[var(--bg-secondary)] border-t border-[var(--border-color)] shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-40">
            <div class="flex justify-around">
                <button id="nav-home" class="flex-1 flex flex-col items-center justify-center p-3 text-[var(--text-secondary)] hover:bg-[var(--bg-accent)]"><i class="ph-bold ph-house text-2xl"></i><span class="text-xs font-medium">Beranda</span></button>
                <button id="nav-challenge" class="flex-1 flex flex-col items-center justify-center p-3 text-[var(--text-secondary)] hover:bg-[var(--bg-accent)]"><i class="ph-bold ph-trophy text-2xl"></i><span class="text-xs font-medium">Tantangan</span></button>
                <button id="nav-profile" class="flex-1 flex flex-col items-center justify-center p-3 text-[var(--text-secondary)] hover:bg-[var(--bg-accent)]"><i class="ph-bold ph-user text-2xl"></i><span class="text-xs font-medium">Profil</span></button>
            </div>
        </footer>
    </div>
    
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm"></div>

    <script>
        // --- DATABASE ---
        const dataMakanan = [
            { id: 1, nama: "Nasi Campur Bali", kategori: "Nasi", deskripsiSingkat: "Nasi putih lengkap dengan berbagai lauk khas Bali.", deskripsi: "Nasi Campur Bali adalah hidangan nasi putih yang disajikan dengan beragam lauk pauk khas Bali. Ini adalah cerminan sejati dari kekayaan rasa pulau ini, sering kali mencakup ayam suwir, lawar, sate lilit, telur, sayuran urap, dan sambal matah yang pedas menyegarkan.", filosofi: "Nasi Campur melambangkan konsep 'Tri Hita Karana' atau harmoni, di mana berbagai elemen berbeda—rasa, tekstur, dan bahan—bersatu padu dalam satu piring untuk menciptakan keseimbangan yang sempurna.", galeri: ["nasi_campur_bali.jpg"], rekomendasi: [ { nama: "Warung Nasi Campur Kubu Sari", alamat: "Jl. Gajah Mada, Pemecutan Kaja, Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Nasi+Campur+Kubu+Sari+Denpasar" }, { nama: "Warung Makan Bu Rus", alamat: "Pusat Ubud, Ubud", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Makan+Bu+Rus+Ubud" }, { nama: "Warung Wardani", alamat: "Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Wardani+Denpasar" } ] },
            { id: 2, nama: "Babi Guling", kategori: "Daging", deskripsiSingkat: "Pesta daging babi panggang dengan kulit super renyah.", deskripsi: "Hidangan ikonik Bali berupa babi utuh yang dipanggang dengan bumbu basa gede hingga kulitnya renyah sempurna. Disajikan dengan lawar, sate, dan kuah kaldu.", filosofi: "Melambangkan kemakmuran dan persembahan syukur, babi guling adalah sajian wajib dalam upacara adat besar di Bali, simbol kebersamaan dan perayaan.", galeri: ["babiguling.jpg"], rekomendasi: [ { nama: "Babi Guling Pak Malen", alamat: "Jl. Sunset Road No. 554, Seminyak, Kuta", gmaps: "https://goo.gl/maps/1TSXu5YZJMHQfUtH9" }, { nama: "Babi Guling Bu Oka", alamat: "Ubud", gmaps: "https://www.google.com/maps/search/?api=1&query=Babi+Guling+Ibu+Oka+Ubud" }, { nama: "Babi Guling Pak Putu", alamat: "Gianyar", gmaps: "https://www.google.com/maps/search/?api=1&query=Babi+Guling+Pak+Putu+Gianyar" } ] },
            { id: 3, nama: "Tipat Blayag", kategori: "Salad", deskripsiSingkat: "Ketupat khas Bali disajikan dengan urap sayur dan kelapa.", deskripsi: "Tipat Blayag adalah hidangan ketupat khas dari daerah Buleleng, Bali, yang disajikan dengan bumbu kacang dan kelapa yang khas, sayuran urap, dan terkadang potongan ayam.", filosofi: "Hidangan ini mencerminkan kesederhanaan dan kekayaan alam Bali Utara. Tekstur lembut dari tipat dan bumbu yang gurih adalah perpaduan yang membumi.", galeri: ["tipat_blayag.jpg"], rekomendasi: [ { nama: "Tipat Blayag Raja", alamat: "Karangasem (Amlapura)", gmaps: "https://www.google.com/maps/search/?api=1&query=Tipat+Blayag+Raja+Karangasem" }, { nama: "Blayag Mek Sambru", alamat: "Singaraja (Buleleng)", gmaps: "https://www.google.com/maps/search/?api=1&query=Blayag+Mek+Sambru+Singaraja" }, { nama: "Tipat Blayag Sendang Restaurant", alamat: "Mayura Ubud Retreat, Ubud", gmaps: "https://www.google.com/maps/search/?api=1&query=Mayura+Ubud+Retreat" } ] },
            { id: 4, nama: "Sate Lilit", kategori: "Sate", deskripsiSingkat: "Sate yang dililitkan ke batang serai, memakai daging ikan, ayam, atau babi.", deskripsi: "Berbeda dari sate biasa, Sate Lilit dibuat dari daging cincang yang kaya bumbu, lalu dililitkan pada batang serai atau bambu pipih. Aroma serai yang terbakar memberikan cita rasa yang unik.", filosofi: "Kata 'lilit' melambangkan persatuan dan gotong royong masyarakat Bali. Bentuknya yang menyatu adalah simbol kebersamaan yang erat.", galeri: ["sate_lilit.jpg"], rekomendasi: [ { nama: "Warung Ngurah Sate Lilit", alamat: "Seminyak/Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Ngurah+Sate+Lilit" }, { nama: "Warung Wardani (halal)", alamat: "Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Wardani+Denpasar" }, { nama: "Made's Warung", alamat: "Seminyak", gmaps: "https://www.google.com/maps/search/?api=1&query=Made's+Warung+Seminyak" } ] },
            { id: 5, nama: "Ayam Betutu", kategori: "Ayam & Bebek", deskripsiSingkat: "Ayam utuh dibumbui rempah Bali, dimasak lama.", deskripsi: "Ayam atau bebek utuh yang diisi bumbu betutu, lalu dibungkus daun pisang dan dipanggang dalam sekam api selama berjam-jam. Hasilnya adalah daging yang sangat empuk dan kaya rasa.", filosofi: "Betutu adalah simbol kesabaran dan ketelitian. Proses memasaknya yang lama mengajarkan bahwa untuk mencapai hasil yang sempurna, dibutuhkan dedikasi dan waktu.", galeri: ["ayamnbetutu.jpg"], rekomendasi: [ { nama: "Ayam Betutu Khas Gilimanuk", alamat: "Jl. Tuban No.3, Kuta", gmaps: "https://www.google.com/maps/search/?api=1&query=Ayam+Betutu+Khas+Gilimanuk+Tuban" }, { nama: "Ayam Betutu Men Tempeh", alamat: "Gilimanuk", gmaps: "https://www.google.com/maps/search/?api=1&query=Ayam+Betutu+Men+Tempeh+Gilimanuk" }, { nama: "Warung Ayam Betutu Mek Nengah", alamat: "Ubud area", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Ayam+Betutu+Mek+Nengah+Ubud" } ] },
            { id: 6, nama: "Lawar", kategori: "Daging", deskripsiSingkat: "Campuran kelapa parut, sayur, dan daging, kaya bumbu.", deskripsi: "Lawar adalah masakan berupa campuran sayur-sayuran, kelapa parut, dan daging cincang yang dibumbui secara merata. Ada varian lawar merah (dengan darah) dan lawar putih (tanpa darah).", filosofi: "Lawar adalah representasi keseimbangan (Rwa Bhineda) dalam hidup. Ia menyatukan unsur nabati (sayuran) dan hewani (daging) menjadi satu kesatuan yang harmonis.", galeri: ["lawar.jpg"], rekomendasi: [ { nama: "Lawar Kuwir Men Koko", alamat: "Jl. Raya Canggu, Berawa", gmaps: "https://www.google.com/maps/search/?api=1&query=Lawar+Kuwir+Men+Koko+Canggu" }, { nama: "Lawar Bali Kartika", alamat: "Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Lawar+Bali+Kartika+Denpasar" }, { nama: "Warung Lawar Kodi", alamat: "Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Lawar+Kodi+Denpasar" } ] },
            { id: 7, nama: "Nasi Jinggo", kategori: "Nasi", deskripsiSingkat: "Nasi kecil bungkus daun pisang, cemilan malam praktis.", deskripsi: "Hidangan ini terdiri dari tipat (ketupat atau lontong) yang dicampur dengan sayuran rebus seperti kacang panjang, tauge, dan kangkung, lalu disiram dengan bumbu kacang yang gurih, manis, dan sedikit pedas. Rasanya mirip gado-gado, tetapi dengan cita rasa khas Bali yang lebih kuat, biasanya diberi tambahan jeruk limau dan taburan bawang goreng.", filosofi: "Simbol kesederhanaan dan kepraktisan, Nasi Jinggo awalnya dibuat untuk para pekerja malam yang membutuhkan makanan cepat, murah, dan mudah dibawa.", galeri: ["nasi_jinggo.jpg"], rekomendasi: [ { nama: "Nasi Jinggo Diponegoro", alamat: "Jl. Diponegoro No.99, Denpasar Barat", gmaps: "https://www.google.com/maps/search/?api=1&query=Nasi+Jinggo+Diponegoro" }, { nama: "Nasi Jinggo Om Gundul", alamat: "Denpasar area", gmaps: "https://www.google.com/maps/search/?api=1&query=Nasi+Jinggo+Om+Gundul+Denpasar" }, { nama: "Nasi Jinggo Thamrin", alamat: "Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Nasi+Jinggo+Thamrin+Denpasar" } ] },
            { id: 8, nama: "Tipat Cantok", kategori: "Salad", deskripsiSingkat: "Hidangan tipat yang dicampur dengan sayuran rebus lalu disiram dengan bumbu kacang yang gurih.", deskripsi: "Sebuah hidangan unik yang menggabungkan segarnya irisan buah-buahan seperti mangga muda dan bengkuang dengan kuah pedas yang dibuat dari kaldu ikan pindang.", filosofi: "Tipat Cantok melambangkan kesederhanaan, kebersamaan, dan harmoni. Tipat mencerminkan ikatan dan persatuan, sementara cantok (mengulek) melambangkan penyatuan berbagai elemen menjadi satu keharmonisan rasa seperti nilai gotong royong dalam budaya Bali.", galeri: ["tipat_cantok.jpg"], rekomendasi: [ { nama: "Warung Lamis tipat cantok, tipat kare, rujak kuah pindang", alamat: "Gianyar", gmaps: "https://maps.app.goo.gl/MqEQyTqny9vywxap9" }, { nama: "Warung Tipat Cantok,rujak,bubur bumbu kuning", alamat: "Gianyar", gmaps: "https://maps.app.goo.gl/bQxGLwprNHtroWcH6" }, { nama: "Warung Tipat Cantok Singaraja", alamat: "Bali Singaraja", gmaps: "https://maps.app.goo.gl/8nTYrxk57qxTgrrj6" } ] },
            { id: 9, nama: "Serombotan", kategori: "Salad", deskripsiSingkat: "Sayur rebus dicampur bumbu kelapa pedas khas Klungkung.", deskripsi: "Serombotan adalah hidangan sayuran khas Klungkung yang terdiri dari kangkung, bayam, dan tauge yang direbus, lalu dicampur dengan bumbu khas yang disebut 'kalas' (santan kental berbumbu) dan bumbu kacang.", filosofi: "Serombotan adalah cerminan rasa syukur atas hasil bumi. Setiap komponen sayuran memiliki maknanya sendiri, dan bersama-sama menciptakan hidangan yang sehat dan lezat.", galeri: ["serombotan.jpg"], rekomendasi: [ { nama: "Warung Mek Metar", alamat: "Jl. Untung Surapati, Semarapura Tengah, Klungkung", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Mek+Metar+Klungkung" }, { nama: "Warung Bu Geria", alamat: "Muliawan, Denpasar", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Serombotan+Bu+Geria+Denpasar" }, { nama: "Pasar Senggol Klungkung", gmaps: "https://www.google.com/maps/search/?api=1&query=Pasar+Senggol+Klungkung" } ] },
            { id: 10, nama: "Tum Ayam", kategori: "Lauk", deskripsiSingkat: "Ayam cincang berbumbu dibungkus daun pisang lalu dikukus.", deskripsi: "Tum Ayam adalah lauk yang terbuat dari daging ayam cincang yang dicampur dengan bumbu basa gede dan santan, lalu dibungkus daun pisang berbentuk tum dan dikukus hingga matang.", filosofi: "Proses membungkus dengan daun pisang dan mengukus adalah teknik memasak kuno yang menjaga keaslian rasa dan nutrisi, sebuah kearifan lokal dalam mengolah makanan.", galeri: ["tum_ayam.jpg"], rekomendasi: [ { nama: "Ayam Betutu Men Tempeh (Lauk)", alamat: "Gilimanuk", gmaps: "https://www.google.com/maps/search/?api=1&query=Ayam+Betutu+Men+Tempeh+Gilimanuk" }, { nama: "Warung Mek Nengah (Lauk)", alamat: "Bali", gmaps: "https://www.google.com/maps/search/?api=1&query=Warung+Ayam+Betutu+Mek+Nengah" }, { nama: "Warung lokal tradisional", alamat: "Ubud atau Klungkung", gmaps: "#" } ] }
        ];

        const tantanganData = [
            { id: 1, nama: "Penakluk Sate", deskripsi: "Cicipi Sate Lilit.", ikon: "ph-duotone ph-flame", targetKategori: "Sate", targetCount: 1 },
            { id: 2, nama: "Ahli Salad Bali", deskripsi: "Coba 2 jenis hidangan salad/sayur.", ikon: "ph-duotone ph-leaf", targetKategori: "Salad", targetCount: 2 },
            { id: 3, nama: "Pecinta Nasi Bali", deskripsi: "Coba semua hidangan nasi.", ikon: "ph-duotone ph-bowl-rice", targetKategori: "Nasi", targetCount: 2 },
            { id: 4, nama: "Master Daging", deskripsi: "Coba 2 hidangan daging.", ikon: "ph-duotone ph-steak", targetKategori: "Daging", targetCount: 2 },
            { id: 5, nama: "Petualang Bali", deskripsi: "Coba 5 makanan berbeda.", ikon: "ph-duotone ph-map-trifold", targetKategori: "ALL", targetCount: 5 }
        ];
        const temaData = { orange: "#f97316", teal: "#14b8a6", pink: "#ec4899" };

        // --- APP STATE & ELEMENTS ---
        let state = { currentPage: 'home', user: null, favorites: [], darkMode: false, journal: {}, unlockedBadges: [], theme: 'orange', mapFilter: 'Semua' };
        const elements = { 
            html: document.documentElement, 
            authContainer: document.getElementById('auth-container'), 
            mainApp: document.getElementById('main-app'), 
            pageContent: document.getElementById('page-content'), 
            appTitle: document.getElementById('app-title'), 
            backButton: document.getElementById('back-button'), 
            darkModeToggle: document.getElementById('dark-mode-toggle'), 
            modalContainer: document.getElementById('modal-container'), 
            splashScreen: document.getElementById('splash-screen'),
            nav: { home: document.getElementById('nav-home'), challenge: document.getElementById('nav-challenge'), profile: document.getElementById('nav-profile') } 
        };
        
        // --- FORWARD DECLARATIONS ---
        let initializeApp;
        let runSplashScreen;

        // --- LOCAL STORAGE & STATE MANAGEMENT ---
        const saveState = () => localStorage.setItem('citarasaDewataStateV8', JSON.stringify(state));
        const loadState = () => {
            const savedState = JSON.parse(localStorage.getItem('citarasaDewataStateV8'));
            if (savedState) state = { ...state, ...savedState };
            const users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
            return users;
        };

        // --- AUTHENTICATION ---
        const handleLogin = (email, password) => {
            const users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
            const foundUser = users.find(u => u.email === email && u.password === password);
            if (foundUser) {
                state.user = { name: foundUser.name, email: foundUser.email, password: foundUser.password, twoFactor: foundUser.twoFactor || false, profilePic: foundUser.profilePic || '' }; // Ensure profilePic and twoFactor are loaded
                saveState();
                initializeApp(false);
            } else {
                alert("Email atau password salah!");
            }
        };
        
        const handleRegister = (name, email, password) => {
            let users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
            const userExists = users.some(u => u.email === email);
            if (userExists) {
                alert("Email sudah terdaftar!");
                return;
            }
            users.push({ name, email, password, twoFactor: false, profilePic: '' });
            localStorage.setItem('citarasaUsers', JSON.stringify(users));
            handleLogin(email, password);
        };

        const handleLogout = () => {
            state.user = null;
            state.favorites = [];
            state.journal = {};
            state.unlockedBadges = [];
            saveState();
            initializeApp(false);
        };

        // --- CORE FUNCTIONS ---
        const navigateTo = (page) => { state.currentPage = page; renderApp(); };
        const toggleFavorite = (id) => { const index = state.favorites.indexOf(id); if (index > -1) state.favorites.splice(index, 1); else state.favorites.push(id); saveState(); renderApp(); };
        const toggleDarkMode = () => { state.darkMode = !state.darkMode; elements.html.classList.toggle('dark'); elements.darkModeToggle.innerHTML = state.darkMode ? '<i class="ph-bold ph-sun"></i>' : '<i class="ph-bold ph-moon"></i>'; saveState(); };
        const toggleJournal = (id) => { state.journal[id] = !state.journal[id]; checkChallenges(); saveState(); renderApp(); };
        const checkChallenges = () => {
            tantanganData.forEach(t => {
                let triedInCategory;
                if (t.targetKategori === "ALL") {
                    triedInCategory = Object.keys(state.journal).filter(jid => state.journal[jid]).length;
                } else {
                    triedInCategory = Object.keys(state.journal).filter(jid => state.journal[jid] && dataMakanan.find(m => m.id == jid)?.kategori === t.targetKategori).length;
                }
                if (triedInCategory >= t.targetCount && !state.unlockedBadges.includes(t.id)) {
                    state.unlockedBadges.push(t.id);
                    showModal(`<div class="bg-[var(--bg-secondary)] text-center w-11/12 p-6 rounded-2xl shadow-xl page-enter"><i class="${t.ikon} text-6xl text-yellow-400"></i><h2 class="text-2xl font-bold font-display mt-2">Lencana Terbuka!</h2><p>"${t.nama}"</p><button onclick="hideModal()" class="mt-4 w-full bg-[var(--brand-primary)] text-white font-bold py-2 rounded-lg">Luar Biasa!</button></div>`);
                }
            });
        };
        const applyTheme = (theme) => { state.theme = theme; if(temaData[theme]) { document.documentElement.style.setProperty('--brand-primary', temaData[theme]); } saveState(); };
        const showModal = (content) => { elements.modalContainer.innerHTML = content; elements.modalContainer.classList.remove('hidden'); elements.modalContainer.classList.add('flex'); };
        const hideModal = () => { elements.modalContainer.classList.add('hidden'); elements.modalContainer.classList.remove('flex'); };
        
        const showSupportModal = () => {
            const modalContent = `
                <div class="bg-[var(--bg-secondary)] w-11/12 max-h-[90vh] overflow-y-auto rounded-2xl shadow-xl page-enter">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-2xl font-bold font-display">Hubungi Support</h2>
                            <button onclick="hideModal()" class="text-[var(--text-secondary)] hover:text-[var(--text-primary)]">
                                <i class="ph-bold ph-x text-2xl"></i>
                            </button>

            `;

            // Buka email client dengan data yang sudah disiapkan
            const mailtoLink = `mailto:support@citarasadewata.id?subject=[Citarasa Dewata Support] ${encodeURIComponent(formData.title)}&body=${encodeURIComponent(emailBody)}`;
            
            // Tampilkan modal konfirmasi
            showModal(`
                <div class="bg-[var(--bg-secondary)] text-center w-11/12 p-6 rounded-2xl shadow-xl page-enter">
                    <i class="ph-duotone ph-check-circle text-6xl text-green-500 mb-4"></i>
                    <h2 class="text-2xl font-bold font-display mb-2">Laporan Terkirim!</h2>
                    <p class="text-[var(--text-secondary)] mb-4">Tim support kami akan segera menghubungi Anda.</p>
                    <div class="space-y-3">
                        <button onclick="window.open('${mailtoLink}', '_blank')" class="w-full bg-[var(--brand-primary)] text-white py-2 rounded-lg font-semibold">
                            <i class="ph-bold ph-envelope mr-2"></i>
                            Buka Email Client
                        </button>
                        <button onclick="hideModal()" class="w-full bg-gray-500 text-white py-2 rounded-lg font-semibold">
                            Tutup
                        </button>
                    </div>
                </div>
            `);

            // Reset form
            document.getElementById('support-form-modal').reset();
            document.getElementById('support-name-modal').value = formData.name;
            document.getElementById('support-email-modal').value = formData.email;
        };

        const renderChallengePage = () => {
             elements.pageContent.innerHTML = `
                <div class="page-enter space-y-6">
                    <div>
                        <h3 class="text-xl font-bold mb-4">Tantangan Kuliner</h3>
                        <div class="space-y-4">
                        ${tantanganData.map(t => {
                            let triedInCategory;
                            if (t.targetKategori === "ALL") {
                                triedInCategory = Object.keys(state.journal).filter(jid => state.journal[jid]).length;
                            } else {
                                triedInCategory = Object.keys(state.journal).filter(jid => state.journal[jid] && dataMakanan.find(m => m.id == jid)?.kategori === t.targetKategori).length;
                            }
                            const progress = Math.min((triedInCategory / t.targetCount) * 100, 100);
                            return `
                                <div class="bg-[var(--bg-secondary)] p-4 rounded-xl shadow-sm">
                                    <div class="flex items-center gap-4">
                                        <i class="${t.ikon} text-4xl ${state.unlockedBadges.includes(t.id) ? 'text-yellow-400' : 'text-[var(--text-accent)]'}"></i>
                                        <div>
                                            <h4 class="font-bold">${t.nama}</h4>
                                            <p class="text-sm text-[var(--text-secondary)]">${t.deskripsi}</p>
                                        </div>
                                    </div>
                                    <div class="w-full bg-[var(--border-color)] rounded-full h-2.5 mt-3">
                                        <div class="bg-[var(--brand-primary)] h-2.5 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                                    </div>
                                    <p class="text-xs text-right mt-1 text-[var(--text-secondary)]">${triedInCategory}/${t.targetCount}</p>
                                </div>
                            `;
                        }).join('')}
                        </div>
                    </div>
                </div>
            `;
        };


const renderProfilePage = () => {
    // Tentukan sumber gambar profil
    const profilePicSrc = state.user.profilePic || 'https://via.placeholder.com/150/f97316/ffffff?text=U'; // Placeholder default

    elements.pageContent.innerHTML = `
        <div class="page-enter space-y-6">
            <div class="text-center">
                <div class="relative w-32 h-32 mx-auto rounded-full overflow-hidden border-4 border-[var(--brand-primary)] shadow-md mb-4">
                    <img id="profile-pic-display" src="${profilePicSrc}" alt="Foto Profil" class="w-full h-full object-cover">
                    <label for="profile-pic-upload" class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-xl cursor-pointer opacity-0 hover:opacity-100 transition-opacity duration-300">
                        <i class="ph-bold ph-camera"></i>
                    </label>
                    <input type="file" id="profile-pic-upload" accept="image/*" class="hidden">
                    ${state.user.profilePic ? `
                        <button id="remove-profile-pic" class="absolute top-0 right-0 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center text-sm hover:bg-red-600 transition-colors">
                            <i class="ph-bold ph-x"></i>
                        </button>
                    ` : ''}
                </div>
                <h2 class="text-2xl font-bold mt-2">${state.user.name}</h2>
                <p class="text-[var(--text-secondary)]">${state.user.email}</p>
                <p class="text-xs text-[var(--text-secondary)] mt-1">Klik foto untuk mengubah</p>
            </div>
            <div class="bg-[var(--bg-secondary)] p-4 rounded-xl shadow-sm">
                <h3 class="text-xl font-bold mb-3">Statistik Saya</h3>
                <div class="flex justify-around text-center">
                    <div>
                        <p class="text-2xl font-bold text-[var(--brand-primary)]">${Object.keys(state.journal).filter(k => state.journal[k]).length}</p>
                        <p class="text-sm text-[var(--text-secondary)]">Telah Dicoba</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-[var(--brand-primary)]">${state.favorites.length}</p>
                        <p class="text-sm text-[var(--text-secondary)]">Favorit</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-[var(--brand-primary)]">${state.unlockedBadges.length}</p>
                        <p class="text-sm text-[var(--text-secondary)]">Lencana</p>
                    </div>
                </div>
            </div>

            <div class="bg-[var(--bg-secondary)] p-4 rounded-xl shadow-sm">
                <h3 class="text-xl font-bold mb-3">Lencana Saya</h3>
                <div class="flex flex-wrap gap-4 justify-center">
                    ${
                        state.unlockedBadges.length === 0
                        ? '<p class="text-[var(--text-secondary)]">Belum ada lencana.</p>'
                        : tantanganData.filter(t => state.unlockedBadges.includes(t.id)).map(t => `
                            <div class="flex flex-col items-center">
                                <i class="${t.ikon} text-4xl text-yellow-400"></i>
                                <span class="text-xs font-semibold mt-1">${t.nama}</span>
                            </div>
                        `).join('')
                    }
                </div>
            </div>

            <div class="bg-[var(--bg-secondary)] p-4 rounded-xl shadow-sm">
                <h3 class="text-xl font-bold mb-3">Edit Profil</h3>
                <p class="text-[var(--text-secondary)] mb-4">Ubah informasi profil Anda.</p>
                <form id="edit-profile-form" class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium mb-1">Username</label>
                        <input type="text" id="edit-username" value="${state.user.name}" placeholder="Username baru" required class="w-full px-4 py-2 border rounded-lg bg-[var(--bg-primary)] text-[var(--text-primary)]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" id="edit-email" value="${state.user.email}" placeholder="Email baru" required class="w-full px-4 py-2 border rounded-lg bg-[var(--bg-primary)] text-[var(--text-primary)]">
                    </div>
                    <button type="submit" class="w-full bg-[var(--brand-primary)] text-white py-2 rounded-lg font-semibold hover:bg-[var(--brand-secondary)] transition-colors">Simpan Perubahan</button>
                </form>
            </div>

            <div class="bg-[var(--bg-secondary)] p-4 rounded-xl shadow-sm">
                <h3 class="text-xl font-bold mb-3">Keamanan Akun</h3>
                <p class="text-[var(--text-secondary)]">Atur ulang password dan aktifkan verifikasi dua langkah.</p>
                <form id="change-password-form" class="space-y-3">
                    <input type="password" id="current-password" placeholder="Password saat ini" required class="w-full px-4 py-2 border rounded-lg">
                    <input type="password" id="new-password" placeholder="Password baru" required class="w-full px-4 py-2 border rounded-lg">
                    <input type="password" id="confirm-password" placeholder="Konfirmasi password baru" required class="w-full px-4 py-2 border rounded-lg">
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Simpan Password</button>
                </form>
                <label class="flex items-center space-x-3 mt-4">
                    <input type="checkbox" id="two-factor-toggle" class="form-checkbox h-5 w-5 text-blue-600">
                    <span>Aktifkan verifikasi dua langkah melalui email</span>
                </label>
            </div>

            <div class="bg-[var(--bg-secondary)] p-4 rounded-xl shadow-sm">
                <h3 class="text-xl font-bold mb-3">Bantuan & Support</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-[var(--bg-accent)] rounded-lg">
                        <div class="flex items-center gap-3">
                            <i class="ph-duotone ph-headset text-2xl text-[var(--brand-primary)]"></i>
                            <div>
                                <p class="font-semibold">Hubungi Support</p>
                                <p class="text-sm text-[var(--text-secondary)]">Laporkan masalah atau minta bantuan</p>
                            </div>
                        </div>
                        <button id="open-support-modal" class="text-[var(--brand-primary)]">
                            <i class="ph-bold ph-arrow-right text-xl"></i>
                        </button>
                    </div>
                    
                    <div class="flex items-center justify-between p-3 bg-[var(--bg-accent)] rounded-lg">
                        <div class="flex items-center gap-3">
                            <i class="ph-duotone ph-phone text-2xl text-[var(--brand-primary)]"></i>
                            <div>
                                <p class="font-semibold">Telepon Langsung</p>
                                <p class="text-sm text-[var(--text-secondary)]">Adrian: +62 821-1590-7349</p>
                            </div>
                        </div>
                        <a href="tel:+6282115907349" class="text-[var(--brand-primary)]">
                            <i class="ph-bold ph-phone-call text-xl"></i>
                        </a>
                    </div>

                    <div class="flex items-center justify-between p-3 bg-[var(--bg-accent)] rounded-lg">
                        <div class="flex items-center gap-3">
                            <i class="ph-duotone ph-envelope text-2xl text-[var(--brand-primary)]"></i>
                            <div>
                                <p class="font-semibold">Email Support</p>
                                <p class="text-sm text-[var(--text-secondary)]">support@citarasadewata.id</p>
                            </div>
                        </div>
                        <a href="mailto:support@citarasadewata.id" class="text-[var(--brand-primary)]">
                            <i class="ph-bold ph-envelope text-xl"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div>
                <button id="logout-btn" class="w-full py-3 bg-red-500 text-white rounded-lg font-bold">Keluar</button>
            </div>
        </div>
    `;

    // Initialize two-factor toggle state
    document.getElementById("two-factor-toggle").checked = state.user.twoFactor;

    // Event listener untuk form ganti password
    document.getElementById("change-password-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const currentPass = document.getElementById("current-password").value;
        const newPass = document.getElementById("new-password").value;
        const confirmPass = document.getElementById("confirm-password").value;

        if (newPass !== confirmPass) {
            alert("Password baru dan konfirmasi tidak cocok.");
            return;
        }

        if (currentPass !== state.user.password) {
            alert("Password saat ini salah.");
            return;
        }

        state.user.password = newPass;
        let users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
        const userIdx = users.findIndex(u => u.email === state.user.email);
        if (userIdx > -1) {
            users[userIdx].password = newPass;
            localStorage.setItem('citarasaUsers', JSON.stringify(users));
        }

        saveState();
        alert("Password berhasil diperbarui.");
        renderProfilePage();
    });

    // Event listener untuk verifikasi dua langkah
    document.getElementById("two-factor-toggle").addEventListener("change", (e) => {
        state.user.twoFactor = e.target.checked;
        let users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
        const userIdx = users.findIndex(u => u.email === state.user.email);
        if (userIdx > -1) {
            users[userIdx].twoFactor = e.target.checked;
            localStorage.setItem('citarasaUsers', JSON.stringify(users));
        }
        saveState();
    });

    // Event listener untuk form edit profil
    document.getElementById("edit-profile-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const newUsername = document.getElementById("edit-username").value;
        const newEmail = document.getElementById("edit-email").value;

        if (!newUsername || !newEmail) {
            alert("Username dan email tidak boleh kosong.");
            return;
        }

        // Cek apakah email sudah digunakan oleh user lain
        let users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
        const emailExists = users.some(u => u.email === newEmail && u.email !== state.user.email);
        
        if (emailExists) {
            alert("Email sudah digunakan oleh akun lain.");
            return;
        }

        // Update user data
        const oldEmail = state.user.email;
        state.user.name = newUsername;
        state.user.email = newEmail;

        // Update di localStorage
        const userIdx = users.findIndex(u => u.email === oldEmail);
        if (userIdx > -1) {
            users[userIdx].name = newUsername;
            users[userIdx].email = newEmail;
            localStorage.setItem('citarasaUsers', JSON.stringify(users));
        }

        saveState();
        alert("Profil berhasil diperbarui!");
        renderProfilePage();
    });

    // Event listener untuk upload gambar profil
    document.getElementById('profile-pic-upload').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            // Validasi ukuran file (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert("Ukuran file terlalu besar. Maksimal 5MB.");
                return;
            }

            // Validasi tipe file
            if (!file.type.startsWith('image/')) {
                alert("File harus berupa gambar.");
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const imageDataUrl = e.target.result;
                state.user.profilePic = imageDataUrl;

                let users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
                const currentUserIndex = users.findIndex(u => u.email === state.user.email);
                if (currentUserIndex > -1) {
                    users[currentUserIndex].profilePic = imageDataUrl;
                    localStorage.setItem('citarasaUsers', JSON.stringify(users));
                }

                saveState();
                document.getElementById('profile-pic-display').src = imageDataUrl;
            };
            reader.readAsDataURL(file);
        }
    });

    // Event listener untuk hapus foto profil
    const removeProfilePicBtn = document.getElementById('remove-profile-pic');
    if (removeProfilePicBtn) {
        removeProfilePicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('Apakah Anda yakin ingin menghapus foto profil?')) {
                state.user.profilePic = '';
                
                let users = JSON.parse(localStorage.getItem('citarasaUsers')) || [];
                const currentUserIndex = users.findIndex(u => u.email === state.user.email);
                if (currentUserIndex > -1) {
                    users[currentUserIndex].profilePic = '';
                    localStorage.setItem('citarasaUsers', JSON.stringify(users));
                }
                
                saveState();
                renderProfilePage();
            }
        });
    }

    // Event listener untuk buka modal support
    document.getElementById('open-support-modal').addEventListener('click', () => {
        showSupportModal();
    });

    document.getElementById('logout-btn').addEventListener('click', handleLogout);
};

        // --- INITIALIZATION ---
        initializeApp = (withSplash = true) => {
            loadState();
            if (!state.user) {
                renderAuthPage();
                return;
            }

            elements.authContainer.classList.add('hidden');
            elements.mainApp.classList.remove('opacity-0');

            Object.values(elements.nav).forEach(btn => btn.addEventListener('click', () => navigateTo(btn.id.split('-')[1])));
            elements.backButton.addEventListener('click', () => navigateTo('home'));
            elements.darkModeToggle.addEventListener('click', toggleDarkMode);
            
            if (withSplash) {
                elements.mainApp.style.opacity = '0';
                runSplashScreen(renderApp);
            } else {
                elements.mainApp.style.opacity = '1';
                renderApp();
            }
        };
        
        runSplashScreen = (onCompleteCallback) => {
            const tl = gsap.timeline({onComplete: () => {
                if(elements.splashScreen) elements.splashScreen.style.display = 'none';
                gsap.to(elements.mainApp, { opacity: 1, duration: 0.5 });
                if (onCompleteCallback) onCompleteCallback();
            }});

            const title = "Citarasa Dewata";
            const titleContainer = document.getElementById('splash-title');
            if (!titleContainer) return; 
            titleContainer.innerHTML = ''; 
            
            title.split('').forEach(char => {
                const span = document.createElement('span');
                span.textContent = char;
                span.className = 'title-char';
                if (char === ' ') span.style.width = '1rem';
                titleContainer.appendChild(span);
            });

            tl.to("#splash-icon", { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.7)" })
              .to(".title-char", { opacity: 1, y: 0, duration: 0.8, stagger: 0.05, ease: "power3.out" }, "-=0.5")
              .to("#splash-tagline", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, "-=0.5")
              .to("#splash-screen", { opacity: 0, duration: 1, delay: 0.5 });
        };

        document.addEventListener('DOMContentLoaded', () => {
            initializeApp(true); 
        });
    </script>
</body>
</html>
